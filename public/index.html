<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoRSS</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <h1>EcoRSS</h1>
  <p id="build-date"></p>
  <div id="feed"></div>

  <script>
    const CHECK_INTERVAL_MS = 30 * 60 * 1000; // look for a new build every 30 min while the tab is open
    let currentBuildDate = null;

    // Always bypass the browser/CDN cache so the morning build shows up right away.
    async function getJSON(path) {
      const response = await fetch(path, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.json();
    }

    // Format as YYYY-MM-DD in the visitor's local time
    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString('sv-SE', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    function safeLink(url) {
      return /^https?:\/\//i.test(url) ? url : '#';
    }

    function renderBuildDate(buildDate) {
      const formatted = new Date(buildDate).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
      document.getElementById('build-date').textContent = `Last updated: ${formatted}`;
    }

    function renderFeed(articles) {
      const feedContainer = document.getElementById('feed');
      const fragment = document.createDocumentFragment();
      const now = new Date();

      // Only articles up to today (ScienceDirect issue dates can lie in the future)
      const grouped = articles
        .filter(article => new Date(article.date) <= now)
        .reduce((groups, article) => {
          const date = formatDate(article.date);
          (groups[date] ||= []).push(article);
          return groups;
        }, {});

      Object.keys(grouped)
        .sort((a, b) => new Date(b) - new Date(a))
        .forEach(date => {
          const dateHeader = document.createElement('h2');
          dateHeader.textContent = date;
          fragment.appendChild(dateHeader);

          grouped[date].forEach((article, index, array) => {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'entry';

            const titleLink = document.createElement('a');
            titleLink.className = 'title';
            titleLink.href = safeLink(article.link);
            titleLink.textContent = article.title;

            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'details';
            detailsDiv.textContent = article.journal;

            entryDiv.appendChild(titleLink);
            entryDiv.appendChild(detailsDiv);
            fragment.appendChild(entryDiv);

            if (index < array.length - 1) {
              const articleSeparator = document.createElement('hr');
              articleSeparator.className = 'article-separator';
              fragment.appendChild(articleSeparator);
            }
          });

          const groupSeparator = document.createElement('div');
          groupSeparator.className = 'separator';
          fragment.appendChild(groupSeparator);
        });

      feedContainer.replaceChildren(fragment);
    }

    // Re-render only when a newer build has been published – no page reload needed.
    async function refresh() {
      try {
        const { buildDate } = await getJSON('./data/build-date.json');
        if (buildDate === currentBuildDate) return;

        const articles = await getJSON('./data/entries.json');
        renderFeed(articles);
        renderBuildDate(buildDate);
        currentBuildDate = buildDate;
      } catch (error) {
        console.error('Failed to refresh feed:', error);
      }
    }

    refresh();
    setInterval(refresh, CHECK_INTERVAL_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh();
    });
  </script>
</body>
</html>

name: Rebuild and Deploy RSS Feed

# Builds the feed and publishes it straight to GitHub Pages as an artifact.
# Nothing is committed or pushed anywhere, so the daily run does not show up
# on the contribution graph and no gh-pages branch is needed.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 04:23 UTC (06:23 Berlin in summer, 05:23 in winter).
    # Off the full hour on purpose: runs scheduled at :00 are often delayed by hours.
    - cron: "23 4 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run build script
        run: node src/scripts/build.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Public repos get scheduled workflows switched off after 60 days without
  # repository activity. Since this workflow no longer commits, re-enable it via
  # the API on every scheduled run instead (no commit involved).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yaml/enable"
